services:
  postgres:
    image: postgres:17-alpine
    container_name: quran_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: quran_warsh_db
      POSTGRES_USER: quran_user
      POSTGRES_PASSWORD: quran_secure_pwd
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quran_user -d quran_warsh_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO (Optionnel pour tester l'Object Storage S3 en local)
  minio:
    image: minio/minio:latest
    container_name: quran_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: quran_admin
      MINIO_ROOT_PASSWORD: quran_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
